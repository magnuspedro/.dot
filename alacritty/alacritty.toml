[font]
size = 14.0

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[scrolling]
history = 100000
multiplier = 3

[window]
opacity = 0.8
option_as_alt = "Both"

[window.dimensions]
columns = 120
lines = 35

[window.padding]
x = 10
y = 10
