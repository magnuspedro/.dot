# tmux com atalhos no estilo do zellij
#
# Ctrl g    modo normal (como sair do lock no zellij)
#   p       modo pane:   hjkl foco | n novo | d baixo | r direita | x fecha | f fullscreen | HJKL resize | Tab próximo
#   t       modo tab:    hjkl troca | 1-9 vai | n nova | x fecha | r renomeia | Tab alterna
#   s       scroll:      j/k linha | d/u meia página | f busca | e abre no nvim | Esc sai
#   o       sessão:      d detach | w sessões
#   HJKL    resize
#   Ctrl q  fecha sessão
# Sem prefix (Alt, igual zellij): hjkl/setas foco (h/l trocam de tab na borda) | n novo pane
#            +/- resize | [ ] layout | i/o move tab | f terminal flutuante
#            (precisa do Option como Alt no terminal: ver alacritty/alacritty.toml)
#            Ctrl hjkl foco só se a tab tem nvim (senão vai pro terminal; Ctrl l limpa)
# Esc, Enter ou Ctrl g voltam pro "lock".
# Recarregar: tmux source ~/.tmux.conf

# ---------- Geral ----------
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Janelas e panes começam em 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Copy mode com teclas do vim
set -g mode-keys vi

# Novo pane dividindo pelo lado maior (como NewPane do zellij)
%hidden SPLIT_H='split-window -h -c "#{pane_current_path}"'
%hidden SPLIT_V='split-window -v -c "#{pane_current_path}"'
%hidden WIDE='#{e|>:#{pane_width},#{e|*:#{pane_height},2}}'

# ---------- Prefix (modo normal) ----------
unbind C-b
set -g prefix C-g
unbind -a -T prefix

bind p switch-client -T pane
bind t switch-client -T tab
bind s copy-mode
bind o switch-client -T session
bind : command-prompt
bind C-q confirm-before -p "Fechar sessão #S? (y/n)" kill-session
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Escape switch-client -T root
bind Enter  switch-client -T root
bind C-g    switch-client -T root

# ---------- Modo pane ----------
bind -T pane h      if -F "#{!:#{pane_at_left}}" { select-pane -L } \; switch-client -T pane
bind -T pane j      if -F "#{!:#{pane_at_bottom}}" { select-pane -D } \; switch-client -T pane
bind -T pane k      if -F "#{!:#{pane_at_top}}" { select-pane -U } \; switch-client -T pane
bind -T pane l      if -F "#{!:#{pane_at_right}}" { select-pane -R } \; switch-client -T pane
bind -T pane Left   if -F "#{!:#{pane_at_left}}" { select-pane -L } \; switch-client -T pane
bind -T pane Down   if -F "#{!:#{pane_at_bottom}}" { select-pane -D } \; switch-client -T pane
bind -T pane Up     if -F "#{!:#{pane_at_top}}" { select-pane -U } \; switch-client -T pane
bind -T pane Right  if -F "#{!:#{pane_at_right}}" { select-pane -R } \; switch-client -T pane
bind -T pane Tab    select-pane -t :.+ \; switch-client -T pane
bind -T pane H      resize-pane -L 5 \; switch-client -T pane
bind -T pane J      resize-pane -D 5 \; switch-client -T pane
bind -T pane K      resize-pane -U 5 \; switch-client -T pane
bind -T pane L      resize-pane -R 5 \; switch-client -T pane
bind -T pane n      if -F "$WIDE" "$SPLIT_H" "$SPLIT_V"
bind -T pane d      split-window -v -c "#{pane_current_path}"
bind -T pane r      split-window -h -c "#{pane_current_path}"
bind -T pane x      kill-pane
bind -T pane f      resize-pane -Z
bind -T pane p      switch-client -T prefix
bind -T pane Escape switch-client -T root
bind -T pane Enter  switch-client -T root
bind -T pane C-g    switch-client -T root

# ---------- Modo tab ----------
bind -T tab h      previous-window \; switch-client -T tab
bind -T tab k      previous-window \; switch-client -T tab
bind -T tab l      next-window \; switch-client -T tab
bind -T tab j      next-window \; switch-client -T tab
bind -T tab Left   previous-window \; switch-client -T tab
bind -T tab Up     previous-window \; switch-client -T tab
bind -T tab Right  next-window \; switch-client -T tab
bind -T tab Down   next-window \; switch-client -T tab
bind -T tab 1      select-window -t :1
bind -T tab 2      select-window -t :2
bind -T tab 3      select-window -t :3
bind -T tab 4      select-window -t :4
bind -T tab 5      select-window -t :5
bind -T tab 6      select-window -t :6
bind -T tab 7      select-window -t :7
bind -T tab 8      select-window -t :8
bind -T tab 9      select-window -t :9
bind -T tab n      new-window -c "#{pane_current_path}"
bind -T tab x      kill-window
bind -T tab r      command-prompt -I "#W" -p "Nome da tab:" "rename-window -- '%%'"
bind -T tab Tab    last-window
bind -T tab t      switch-client -T prefix
bind -T tab Escape switch-client -T root
bind -T tab Enter  switch-client -T root
bind -T tab C-g    switch-client -T root

# ---------- Modo sessão ----------
bind -T session d      detach-client
bind -T session w      choose-tree -Zs
bind -T session o      switch-client -T prefix
bind -T session Escape switch-client -T root
bind -T session C-g    switch-client -T root

# ---------- Scroll (copy mode) ----------
bind -T copy-mode-vi d      send -X halfpage-down
bind -T copy-mode-vi u      send -X halfpage-up
bind -T copy-mode-vi f      command-prompt -T search -p "Buscar:" "send -X search-backward -- '%%'"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-c    send -X cancel
bind -T copy-mode-vi C-g    send -X cancel
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "pbcopy"
# e: abre todo o histórico do pane no nvim (como EditScrollback do zellij)
bind -T copy-mode-vi e send -X cancel \; \
    capture-pane -J -S - -b scrollback \; \
    display-popup -E -B -w 100% -h 100% 'f=$(mktemp -t tmux-scrollback); tmux save-buffer -b scrollback - | awk "{l[NR]=\$0} NF{n=NR} END{for(i=1;i<=n;i++) print l[i]}" > "$f"; tmux delete-buffer -b scrollback; nvim + "$f"; rm -f "$f"'

# ---------- Sem prefix: Alt igual ao zellij ----------
# Alt hjkl/setas: foco. Na borda, h/l trocam de tab e focam o pane do lado de onde veio
# (MoveFocusOrTab). Com uma tab só, não faz nada na borda (select-pane daria a volta).
bind -n M-h     if -F "#{pane_at_left}"  { if -F "#{>:#{session_windows},1}" { previous-window ; select-pane -t "{right}" } } { select-pane -L }
bind -n M-l     if -F "#{pane_at_right}" { if -F "#{>:#{session_windows},1}" { next-window ; select-pane -t "{left}" } } { select-pane -R }
bind -n M-j     if -F "#{!:#{pane_at_bottom}}" { select-pane -D }
bind -n M-k     if -F "#{!:#{pane_at_top}}" { select-pane -U }
bind -n M-Left  send-keys -K M-h
bind -n M-Right send-keys -K M-l
bind -n M-Down  send-keys -K M-j
bind -n M-Up    send-keys -K M-k
# Alt n: novo pane
bind -n M-n if -F "$WIDE" "$SPLIT_H" "$SPLIT_V"
# Alt + / = cresce o pane, Alt - diminui (Resize Increase/Decrease)
bind -n M-=     { if -F "#{pane_at_right}" { resize-pane -L 4 } { resize-pane -R 4 } ; if -F "#{pane_at_bottom}" { resize-pane -U 2 } { resize-pane -D 2 } }
bind -n M-+     send-keys -K M-=
bind -n M--     { if -F "#{pane_at_right}" { resize-pane -R 4 } { resize-pane -L 4 } ; if -F "#{pane_at_bottom}" { resize-pane -D 2 } { resize-pane -U 2 } }
# Alt [ ]: layout anterior/próximo (Swap Layout)
bind -n M-[     previous-layout
bind -n M-]     next-layout
# Alt i / Alt o: move a tab pra esquerda/direita
bind -n M-i     swap-window -d -t -1
bind -n M-o     swap-window -d -t +1
# Alt f: terminal flutuante (popup com sessão "float" persistente). Alt f de novo esconde.
bind -n M-f     if -F "#{==:#{session_name},float}" { detach-client } { display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'S=${TMUX%%,*}; TMUX= tmux -S "$S" new -A -s float \; set status off' }

# No scroll, Alt hjkl/setas saem do scroll e movem o foco (como no zellij)
bind -T copy-mode-vi M-h     { send -X cancel ; send-keys -K M-h }
bind -T copy-mode-vi M-l     { send -X cancel ; send-keys -K M-l }
bind -T copy-mode-vi M-j     { send -X cancel ; send-keys -K M-j }
bind -T copy-mode-vi M-k     { send -X cancel ; send-keys -K M-k }
bind -T copy-mode-vi M-Left  { send -X cancel ; send-keys -K M-h }
bind -T copy-mode-vi M-Right { send -X cancel ; send-keys -K M-l }
bind -T copy-mode-vi M-Down  { send -X cancel ; send-keys -K M-j }
bind -T copy-mode-vi M-Up    { send -X cancel ; send-keys -K M-k }

# Ctrl hjkl: troca de pane só quando a tab tem nvim aberto (integra com vim-tmux-navigator).
# No pane do nvim a tecla vai pro nvim; sem nvim na tab vai pro terminal (Ctrl l limpa).
%hidden IN_NVIM='#{m/r:^n?vim$,#{pane_current_command}}'
%hidden TAB_NVIM='#{m/r:(^| )n?vim( |$),#{P:#{pane_current_command} }}'
bind -n C-h if -F "$IN_NVIM" { send-keys C-h } { if -F "$TAB_NVIM" { if -F "#{!:#{pane_at_left}}" { select-pane -L } } { send-keys C-h } }
bind -n C-j if -F "$IN_NVIM" { send-keys C-j } { if -F "$TAB_NVIM" { if -F "#{!:#{pane_at_bottom}}" { select-pane -D } } { send-keys C-j } }
bind -n C-k if -F "$IN_NVIM" { send-keys C-k } { if -F "$TAB_NVIM" { if -F "#{!:#{pane_at_top}}" { select-pane -U } } { send-keys C-k } }
bind -n C-l if -F "$IN_NVIM" { send-keys C-l } { if -F "$TAB_NVIM" { if -F "#{!:#{pane_at_right}}" { select-pane -R } } { send-keys C-l } }

# ---------- Tema gruvbox (mesmo visual do zjstatus) ----------
# bg0 #282828 bg1 #3c3836 bg2 #504945 fg #ebdbb2 fg4 #a89984
set -g status-position top
set -g status-interval 15
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g message-command-style "bg=#504945,fg=#fabd2f"
set -g mode-style "bg=#fabd2f,fg=#282828"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g popup-border-style "fg=#fabd2f"
set -g popup-border-lines rounded

# Bloco do modo: cor e ícone mudam com o modo atual
set -g @mode "#{?pane_in_mode,#[bg=#8ec07c]#[fg=#282828]#[bold]  ,#{?#{==:#{client_key_table},pane},#[bg=#83a598]#[fg=#282828]#[bold]  ,#{?#{==:#{client_key_table},tab},#[bg=#d3869b]#[fg=#282828]#[bold]  ,#{?#{==:#{client_key_table},session},#[bg=#fb4934]#[fg=#282828]#[bold]  ,#{?client_prefix,#[bg=#b8bb26]#[fg=#282828]#[bold]  ,#[bg=#928374]#[fg=#282828]#[bold]  }}}}}"

# Atalhos por modo: aparecem no lugar das tabs fora do lock (não ocupa linha extra)
%hidden K="#[bg=#504945]#[fg=#fabd2f]#[bold]"
%hidden D="#[fg=#a89984]#[nobold]"
set -g @hints_normal  "$K p $D pane $K t $D tab $K s $D scroll $K o $D session $K HJKL $D resize $K Ctrl q $D quit $K Esc $D back "
set -g @hints_pane    "$K hjkl $D focus $K n $D new $K d $D down $K r $D right $K x $D close $K f $D fullscreen $K HJKL $D resize $K Tab $D next "
set -g @hints_tab     "$K hjkl $D switch $K 1-9 $D go to $K n $D new $K x $D close $K r $D rename $K Tab $D toggle "
set -g @hints_scroll  "$K j/k $D line $K d/u $D half page $K f $D search $K n/N $D next/prev $K e $D nvim $K v/y $D select/copy $K Esc $D back "
set -g @hints_session "$K d $D detach $K w $D sessions "
set -g @hints "#{?pane_in_mode,#{E:@hints_scroll},#{?#{==:#{client_key_table},pane},#{E:@hints_pane},#{?#{==:#{client_key_table},tab},#{E:@hints_tab},#{?#{==:#{client_key_table},session},#{E:@hints_session},#{?client_prefix,#{E:@hints_normal},}}}}}"
set -g @locked "#{&&:#{!=:#{pane_in_mode},1},#{==:#{client_key_table},root}}"

# Tabs: só o número, ativa em amarelo; ícone quando o pane está em fullscreen
set -g window-status-format         "#[bg=#504945]#[fg=#ebdbb2] #I#{?window_zoomed_flag, \U000F0293,} "
set -g window-status-current-format "#[bg=#fabd2f]#[fg=#282828]#[bold] #I#{?window_zoomed_flag, \U000F0293,} "

set -g status-format[0] "#[align=left]#{E:@mode}#[bg=#504945]#[fg=#fabd2f]#[bold] #S #[default]#[align=centre]#{?#{E:@locked},#[list=on]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange default] ,#[range=window|#{window_index}]#{E:window-status-current-format}#[norange default] },#{E:@hints}}#[nolist default]#[align=right]#[bg=#504945]#[fg=#ebdbb2] %H:%M "
